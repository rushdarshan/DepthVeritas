experiment:
  name: temporal-reprojection
  seed: 42
model:
  backbone:
    variant: vits
    checkpoint_path: checkpoints/depth_anything_v2_vits.pth
    frozen: false
  head:
    name: uncertainty
dataset:
  name: video_manifest
  manifest: data/video_manifest.json
  batch_size: 2
training:
  epochs: 20
  learning_rate: 0.00001
  amp: true
eval:
  align_scale_shift: false
